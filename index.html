<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programamos jugando</title>
<meta name="description" content="Juegos de programación con flechas para nivel inicial. Se juegan en el celular o la tablet y se pueden ver en grande en la TV.">
<meta name="theme-color" content="#2F63B5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // Aparato configurado como TV → directo a la pantalla. Links viejos con ?sala= → al juego.
  (function(){
    try{
      var q = location.search;
      if(/[?&]sala=\d{5}/.test(q)){ location.replace('camino.html' + q); return; }
      if(localStorage.getItem('juegos.rol') === 'tv'){ location.replace('tv.html'); }
    }catch(e){}
  })();
</script>
<style>
  @font-face{ font-family:'Baloo 2'; font-style:normal; font-weight:600; font-display:swap; src:url('baloo2-600.woff2') format('woff2'); }
  @font-face{ font-family:'Baloo 2'; font-style:normal; font-weight:800; font-display:swap; src:url('baloo2-800.woff2') format('woff2'); }
  :root{
    --bg1:#D9ECFF; --bg2:#F1F8EE; --panel:#FFFFFF; --ink:#2E2A26; --shadow:0 5px 0 rgba(0,0,0,.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg1:#15233D; --bg2:#14211C; --panel:#223047; --ink:#F3EFE6; }
  }
  :root[data-theme="dark"]{ --bg1:#15233D; --bg2:#14211C; --panel:#223047; --ink:#F3EFE6; }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ min-height:100%; background:var(--bg1); }
  body{
    margin:0; min-height:100vh; color:var(--ink);
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    font-family:'Baloo 2', ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 16px 20px;
  }
  h1{ margin:8px 0 2px; font-size:clamp(32px,9vw,58px); line-height:1; text-align:center; font-weight:800; }
  .sub{ margin:0 0 22px; font-size:clamp(16px,4.4vw,21px); opacity:.7; text-align:center; }
  .games{ width:min(100%,760px); display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(12px,3vw,22px); }
  .game{
    display:flex; align-items:center; gap:16px; padding:16px; min-height:120px;
    background:var(--panel); border-radius:26px; box-shadow:var(--shadow);
    border-left:12px solid var(--c); color:inherit; text-decoration:none;
  }
  .game:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }
  .game:focus-visible{ outline:4px solid #2E7DD7; outline-offset:3px; }
  .game img{ width:clamp(72px,20vw,100px); height:clamp(72px,20vw,100px); border-radius:22%; flex:none; }
  .game b{ display:block; font-size:clamp(22px,6vw,30px); line-height:1.05; font-weight:800; }
  .game span{ display:block; margin-top:4px; font-size:clamp(14px,3.8vw,17px); opacity:.7; line-height:1.2; }
  .tvlink{ margin-top:auto; padding:22px 12px 4px; font-size:clamp(14px,3.8vw,17px); opacity:.7; color:inherit; }
  .spacer{ flex:1; min-height:18px; }
</style>
</head>
<body>
  <h1>🧩 Programamos jugando</h1>
  <p class="sub">Elegí un juego</p>
  <div class="games" id="games"></div>
  <div class="spacer"></div>
  <a class="tvlink" href="tv.html">📺 Usar este aparato como pantalla</a>

<script src="juegos.js"></script>
<script>
  (function(){
    var wrap = document.getElementById('games');
    (window.JUEGOS || []).forEach(function(j){
      var a = document.createElement('a');
      a.className = 'game';
      a.href = j.pagina;
      a.style.setProperty('--c', j.color || '#2F63B5');
      var img = document.createElement('img'); img.src = j.icono; img.alt = '';
      var t = document.createElement('div');
      var b = document.createElement('b'); b.textContent = j.titulo;
      var s = document.createElement('span'); s.textContent = j.que || '';
      t.appendChild(b); t.appendChild(s);
      a.appendChild(img); a.appendChild(t);
      wrap.appendChild(a);
    });
    if('serviceWorker' in navigator && location.protocol === 'https:'){
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  })();
</script>
</body>
</html>
